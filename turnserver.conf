# Coturn — credentials and realm are supplied by docker-entrypoint.sh (CLI).
listening-ip=0.0.0.0
listening-port=3478

fingerprint
lt-cred-mech

no-cli
no-loopback-peers
no-multicast-peers

# Relay pool (narrow ranges map through Docker/NAT more easily; widen if needed)
min-port=49152
max-port=65535
